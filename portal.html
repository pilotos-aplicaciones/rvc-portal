<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVC Pilotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #CC2929;
  --accent2: #8B1A1A;
  --bg: #F5F3EE;
  --surface: #FFFFFF;
  --border: #E0DCD4;
  --text: #2C2C2A;
  --text2: #6B6963;
  --text3: #A09D96;
  --green: #3B6D11;
  --green-l: #EAF3DE;
  --red: #A32D2D;
  --red-l: #FCEBEB;
  --amber: #854F0B;
  --amber-l: #FAEEDA;
  --blue: #185FA5;
  --blue-l: #E6F1FB;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header { background: var(--accent); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header-left h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.header-sub { font-size: 11px; opacity: .7; margin-top: 2px; }
.admin-badge { background: rgba(255,255,255,.2); font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.hbtn { background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.hbtn:hover { background: rgba(255,255,255,.25); }

.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a1a; padding: 16px; }
.login-card { background: #fff; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,.3); }
.login-logo { width: 64px; height: 64px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 28px; color: #fff; font-weight: 700; }
.login-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.login-card p { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
.login-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.login-btn:hover { background: var(--accent2); }
.login-err { color: var(--red); font-size: 12px; margin-top: 12px; }
.acceso-denegado { color: var(--red); font-size: 13px; background: var(--red-l); border-radius: 8px; padding: 10px; margin-top: 12px; text-align: left; }

.app { display: none; }

.content { padding: 40px 24px 60px; max-width: 900px; margin: 0 auto; }

.greeting { text-align: center; margin-bottom: 36px; }
.greeting-title { font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.greeting-sub { font-size: 14px; color: var(--text2); }

.apps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.app-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; cursor: pointer; transition: all .15s ease; position: relative; text-decoration: none; color: inherit; display: block; }
.app-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.app-card.disabled { opacity: .55; cursor: not-allowed; }
.app-card.disabled:hover { border-color: var(--border); transform: none; box-shadow: none; }
.app-card.admin { border-color: var(--accent); background: linear-gradient(135deg, #fff 0%, #FFF8F8 100%); }
.app-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 14px; }
.app-icon.c1 { background: var(--red-l); }
.app-icon.c2 { background: var(--blue-l); }
.app-icon.c3 { background: var(--amber-l); }
.app-icon.c4 { background: var(--green-l); }
.app-icon.c5 { background: #F1EFE8; }
.app-icon.c6 { background: #EEEDFE; }
.app-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.app-desc { font-size: 13px; color: var(--text2); line-height: 1.4; margin-bottom: 16px; min-height: 36px; }
.app-footer { display: flex; align-items: center; justify-content: space-between; }
.app-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.badge-on { background: var(--green-l); color: var(--green); }
.badge-off { background: #F1EFE8; color: var(--text3); }
.badge-pause { background: var(--amber-l); color: var(--amber); }
.badge-admin { background: rgba(204,41,41,.15); color: var(--accent); }
.badge-locked { background: #F1EFE8; color: var(--text3); }
.app-action { font-size: 13px; color: var(--accent); font-weight: 600; }
.app-card.disabled .app-action { display: none; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; max-width: 380px; margin: 0 auto; line-height: 1.6; }

.loading { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }

.rt-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.15); font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.rt-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(150,255,180,.95); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">R</div>
    <h2>RVC Pilotos</h2>
    <p>Accede a tus aplicaciones</p>
    <button class="login-btn" id="login-btn" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Iniciar sesión con Google
    </button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <h1>RVC Pilotos <span class="rt-badge"><span class="rt-dot"></span>Conectado</span></h1>
      <div class="header-sub" id="hdr-user"></div>
    </div>
    <button class="hbtn" onclick="signOut()">Salir</button>
  </div>

  <div class="content">
    <div class="greeting">
      <div class="greeting-title" id="greeting-title">Hola 👋</div>
      <div class="greeting-sub">Elige una app para comenzar</div>
    </div>

    <div id="apps-container">
      <div class="loading">Cargando apps...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmUlkihNfxV8CyHOZ-38gcEx27jqU0z04",
  authDomain: "rvc-pilotos-app.firebaseapp.com",
  projectId: "rvc-pilotos-app",
  storageBucket: "rvc-pilotos-app.firebasestorage.app",
  messagingSenderId: "304566913753",
  appId: "1:304566913753:web:f1936de8ca85188338ccc8"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const provider = new GoogleAuthProvider();

// URL de la app de administración
const ADMIN_URL = 'https://pilotos-aplicaciones.github.io/rvc-admin/admin.html';
const ADMINS = ['rodortino@gmail.com', 'pilotosaplicaciones@gmail.com'];

// Íconos por defecto si la app no tiene uno definido
const ICONOS = ['📋','📦','📊','📐','📌','📈','📝','🔧','🏗️','📷','🗂️','✅'];
const COLORES = ['c1','c2','c3','c4','c5','c6'];

let currentUser = null;
let userData = null;
let apps = [];
let unsubApps = null;

window.signIn = async function(){
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.textContent = '';
  btn.textContent = 'Conectando...';
  try { await signInWithPopup(auth, provider); }
  catch(e) {
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Iniciar sesión con Google';
    err.textContent = 'Error al conectar. Intenta de nuevo.';
  }
};

window.signOut = async function(){
  if(!confirm('¿Cerrar sesión?')) return;
  if(unsubApps) unsubApps();
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  if(user){
    const email = (user.email||'').toLowerCase();
    try {
      const userDoc = await getDoc(doc(db,'plataforma_usuarios',email));
      if(!userDoc.exists()){
        fbSignOut(auth);
        document.getElementById('login-err').innerHTML = `<div class="acceso-denegado">⛔ Tu cuenta <strong>${email}</strong> no está registrada. Contacta al administrador.</div>`;
        document.getElementById('login-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Iniciar sesión con Google';
        return;
      }
      userData = userDoc.data();
      if(userData.activo === false){
        fbSignOut(auth);
        document.getElementById('login-err').innerHTML = `<div class="acceso-denegado">⛔ Tu cuenta está desactivada. Contacta al administrador.</div>`;
        document.getElementById('login-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Iniciar sesión con Google';
        return;
      }
      currentUser = user;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('hdr-user').textContent = email;
      const nombre = userData.nombre || email.split('@')[0];
      const primerNombre = nombre.split(' ')[0];
      document.getElementById('greeting-title').textContent = `Hola ${primerNombre} 👋`;
      startAppsListener();
    } catch(e){
      console.error('Error verificando acceso:', e);
      fbSignOut(auth);
      document.getElementById('login-err').innerHTML = `<div class="acceso-denegado">⚠ Error al verificar acceso. Intenta de nuevo.</div>`;
    }
  } else {
    currentUser = null;
    userData = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    if(unsubApps){ unsubApps(); unsubApps = null; }
  }
});

function startAppsListener(){
  unsubApps = onSnapshot(collection(db,'plataforma_apps'), snap => {
    apps = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // Ordenar por campo "orden" (las sin orden van al final)
    apps.sort((a,b)=>{
      const oa = a.orden===undefined ? 9999 : a.orden;
      const ob = b.orden===undefined ? 9999 : b.orden;
      return oa - ob;
    });
    renderApps();
  });
}

function renderApps(){
  const container = document.getElementById('apps-container');
  const email = (currentUser.email||'').toLowerCase();
  const esAdmin = ADMINS.includes(email);
  const userApps = userData.apps || [];

  if(apps.length === 0){
    container.innerHTML = `<div class="empty-state">
      <div class="icon">📦</div>
      <p>Aún no hay apps configuradas en la plataforma.</p>
    </div>`;
    return;
  }

  let html = '<div class="apps-grid">';

  apps.forEach((a, idx) => {
    const tieneAcceso = userApps.includes(a.id);
    const activa = a.activa !== false;
    const icono = a.icono || ICONOS[idx % ICONOS.length];
    const colorClass = COLORES[idx % COLORES.length];
    const clickable = tieneAcceso && activa;

    let badge, action;
    if(!tieneAcceso){
      badge = `<span class="app-badge badge-locked">🔒 Sin acceso</span>`;
      action = '';
    } else if(!activa){
      badge = `<span class="app-badge badge-pause">⏸ Pausada</span>`;
      action = '';
    } else {
      badge = `<span class="app-badge badge-on">● Activa</span>`;
      action = `<span class="app-action">Abrir →</span>`;
    }

    const cardClass = clickable ? 'app-card' : 'app-card disabled';
    const onClick = clickable ? `onclick="window.open('${esc(a.url||'')}','_blank')"` : '';

    html += `<div class="${cardClass}" ${onClick}>
      <div class="app-icon ${colorClass}">${icono}</div>
      <div class="app-name">${esc(a.nombre||a.id)}</div>
      <div class="app-desc">${esc(a.descripcion||'')}</div>
      <div class="app-footer">
        ${badge}
        ${action}
      </div>
    </div>`;
  });

  // Si es admin, agregar tarjeta de administración
  if(esAdmin){
    html += `<div class="app-card admin" onclick="window.open('${ADMIN_URL}','_blank')">
      <div class="app-icon c5">⚙</div>
      <div class="app-name">Administración</div>
      <div class="app-desc">Gestionar usuarios y apps de la plataforma</div>
      <div class="app-footer">
        <span class="app-badge badge-admin">⚙ Admin</span>
        <span class="app-action">Abrir →</span>
      </div>
    </div>`;
  }

  html += '</div>';

  // Si el usuario no tiene ninguna app activa con acceso
  const conAccesoActivo = apps.some(a => userApps.includes(a.id) && a.activa !== false);
  if(!conAccesoActivo && !esAdmin){
    html += `<div class="empty-state" style="margin-top:30px">
      <p style="color:var(--text2);font-size:13px">Aún no tienes apps asignadas. Contacta al administrador para solicitar acceso.</p>
    </div>`;
  }

  container.innerHTML = html;
}

function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
</script>
</body>
</html>
